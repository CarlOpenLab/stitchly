name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'designs/stitchly-landing/index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp designs/stitchly-landing/index.html _site/index.html
      - uses: actions/configure-pages@v5
        with:
          # 首次运行自动启用 Pages，无需手动到 Settings 开关
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
